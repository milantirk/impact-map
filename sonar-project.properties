# SonarCloud (SonarQube Cloud) analysis settings.
# sonar.organization and sonar.projectKey come from the repository variables
# SONAR_ORGANIZATION and SONAR_PROJECT_KEY (.github/workflows/sonarcloud.yml).

sonar.projectName=Impact Map
sonar.sourceEncoding=UTF-8

# Production code
sonar.sources=packages/engine/src,apps/api/src,apps/web/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,packages/engine/knowledge/**,**/fixtures/**

# Tests (unit tests per workspace, Playwright end-to-end tests)
sonar.tests=packages/engine/test,apps/api/test,apps/web/test,e2e/tests
sonar.test.exclusions=**/fixtures/**,**/golden/**

# Coverage: vitest writes one merged report at the repository root (npm run test:coverage).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.d.ts,**/main.tsx,**/index.ts

# Generated knowledge data is not source code.
sonar.cpd.exclusions=packages/engine/knowledge/**
