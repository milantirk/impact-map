# Local stack: PostgreSQL + the app image, built from the Dockerfile.
#   docker compose up --build
#   open http://localhost:8080
# The password below is for this local container only. Override it with
# POSTGRES_PASSWORD in your shell or in a .env file (gitignored).
name: impact-map

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: impactmap
      POSTGRES_USER: impactmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U impactmap -d impactmap']
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: impact-map:local
    environment:
      DATABASE_URL: postgres://impactmap:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/impactmap
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: 'false'
    ports:
      - '${APP_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
